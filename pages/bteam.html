<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1a1a" />
<title data-i18n="role.bteam.name">Get Start</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📸%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="../assets/css/bteam.css" />
</head>
<body class="theme-light">

<div class="lang-switcher">
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn active" data-lang="zh">中文</button>
</div>

<div class="bteam-app">

  <!-- Header -->
  <header class="bteam-header">
    <div class="bteam-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/></svg>
      <span data-i18n="role.bteam.name">Get Start</span>
      <span data-i18n="role.bteam.desc">现场拍照</span>
    </div>
    <a href="../index.html" class="btn btn-ghost btn-sm" title="Home">
      <span aria-hidden="true">🏠</span> <span data-i18n="common.home">首页</span>
    </a>
  </header>

  <!-- Session Bar -->
  <div class="session-bar">
    <div class="session-info"><span data-i18n="bteam.session">检验单</span>: <strong id="sessionName">--</strong></div>
    <div class="session-badge" id="sessionBadge">New</div>
  </div>

  <!-- Steps Nav -->
  <nav class="steps-nav" id="stepsNav"></nav>

  <!-- Step Content -->
  <div class="step-content" id="stepContent">
    <!-- Step 0: New Session -->
    <div id="step-0">
      <div class="step-title" data-i18n="bteam.start_new">开始新检验</div>
      <div class="step-subtitle" data-i18n="role.bteam.desc">现场拍照 · 上传照片 · 记录数据</div>
      <div class="data-form" style="margin-top:16px;">
        <div class="form-group">
          <label class="form-label" data-i18n="form.timestamp">提交时间</label>
          <div class="form-control" id="timestampDisplay" style="display:flex;align-items:center;color:#888;background:rgba(255,255,255,0.03);">--</div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.customer">客户代码 (Customer Code)</label>
          <input class="form-control" id="customerInput" type="text" data-i18n-placeholder="form.customer.placeholder" placeholder="e.g. NO1" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.inspection_date">检验日期</label>
          <input class="form-control" id="inspectionDate" type="date" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.pi">PI 单号 (Proforma Invoice)</label>
          <input class="form-control" id="piInput" type="text" data-i18n-placeholder="form.pi.placeholder" placeholder="e.g. PI001" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.batch">批次</label>
          <input class="form-control" id="batchInput" type="text" data-i18n-placeholder="form.batch.placeholder" placeholder="例如：B001" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.model">型号</label>
          <input class="form-control" id="modelInput" type="text" data-i18n-placeholder="form.model.placeholder" placeholder="例如：EEI-7672" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.version">版本</label>
          <input class="form-control" id="versionInput" type="text" data-i18n-placeholder="form.version.placeholder" placeholder="e.g. 001" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.color">颜色</label>
          <input class="form-control" id="colorInput" type="text" data-i18n-placeholder="form.color.placeholder" placeholder="e.g. White" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.type">检验类型</label>
          <select class="form-control" id="typeInput">
            <option value="psi" data-i18n="form.type.psi">PSI 生产检验</option>
            <option value="sample" data-i18n="form.type.sample">Sample 样品检验</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.box_count">箱数</label>
          <input class="form-control" id="boxCountInput" type="number" min="1" placeholder="1" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.inspection_by">检验人 (Inspection by)</label>
          <input class="form-control" id="inspectionByInput" type="text" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.po_no">PO 号 / 订单号 (PO No / Order No)</label>
          <input class="form-control" id="poNoInput" type="text" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.total_qty">总数量 (Total Quantity)</label>
          <input class="form-control" id="totalQtyInput" type="number" inputmode="numeric" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.sample_size">抽样数量 (Sample size)</label>
          <input class="form-control" id="sampleSizeInput" type="number" inputmode="numeric" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="form.supplier">供应商 (Supplier)</label>
          <div class="form-control" id="supplierDisplay" style="display:flex;align-items:center;color:#aaa;background:rgba(255,255,255,0.03);">Decor Trend Industries Sdn Bhd</div>
        </div>
        <button class="btn btn-primary w-full" onclick="BTeam.createSession()" data-i18n="bteam.save_continue">保存并继续</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-info" id="navInfo">Step 1 of 5</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost btn-sm" id="prevBtn" onclick="BTeam.prevStep()" data-i18n="common.previous">Previous</button>
      <button class="btn btn-primary btn-sm" id="nextBtn" onclick="BTeam.nextStep()" data-i18n="common.next">Next</button>
    </div>
  </div>

</div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/storage/storage-adapter.js"></script>
<script>
const STEPS = [
  { key: 'setup', i18n: 'bteam.step.setup', label: '基本信息' },
  { key: 'photos', i18n: 'bteam.step.photos', label: '拍照上传' },
  { key: 'measurements', i18n: 'bteam.step.measurements', label: '尺寸测量' },
  { key: 'submit', i18n: 'bteam.step.submit', label: '提交' }
];

// Supplier is fixed for this deployment (not editable in the form).
const SUPPLIER_NAME = 'Decor Trend Industries Sdn Bhd';

// Step name in the current UI language (falls back to the Chinese label).
function stepLabel(i) {
  const s = STEPS[i];
  return (window.t && s.i18n) ? window.t(s.i18n) : s.label;
}

// Categories repeated inside every box. `dims` = Length/Height/Width/Weight
// inputs shown above the photo drop zone (replaces the free-text notes box).
const MEASURE_CATEGORIES = [
  { key: 'carton_dimension_weight', zh: '箱体尺寸与重量', en: 'Dimension Carton & Weight', dims: true },
  { key: 'every_panel', zh: '内部包装 (Internal Packaging)', en: 'Internal Packaging' },
  { key: 'assembly_instruction', zh: '装配说明', en: 'Assembly Instruction' },
  { key: 'accessories', zh: '配件', en: 'Accessories' },
  { key: 'warning_label', zh: '警告标签/产品标签 (Warning Label/Product label)', en: 'Warning Label/Product label' }
];

// Independent sections shown once after the boxes (not repeated per box).
// They live in measurements.assembly[key] and use the pseudo-box id "global".
const GLOBAL_CATEGORIES = [
  { key: 'fully_assembly', zh: '完整装配', en: 'Fully Assembly', notes: false },
  { key: 'dimension_assembly', zh: '装配尺寸', en: 'Dimension Assembly', dims: true, notes: false }
];
const GLOBAL_BOX = 'global';
const DIM_FIELDS = ['length', 'height', 'width', 'weight'];

const BTeam = {
  currentStep: 0,
  listMode: false,
  sessionId: null,
  sessionData: {},
  _expandedBoxes: new Set(),

  async init() {
    this._renderSteps();
    // I18n only re-labels [data-i18n] nodes; the "Step n of N" text is built
    // from a template, so refresh it when the language is switched.
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setTimeout(() => {
        this._updateNavInfo();
        // Category names on the measurements step are built per language at
        // render time, so rebuild that step (its inputs save on every keystroke).
        if (this.listMode) this._renderHome();
        else if (this.currentStep === 2) this._renderStepContent(2);
      }, 0));
    });
    // Set default date
    const dateInput = document.getElementById('inspectionDate');
    if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
    // Auto-fill submission timestamp (read-only, informational)
    const tsDisplay = document.getElementById('timestampDisplay');
    if (tsDisplay) tsDisplay.textContent = this._formatTimestamp(new Date());
    // Entry points:
    //  - ?resume=<sessionId>  Customer List -> Pending: open that draft
    //  - ?list=1              home screen "Get Start": show the unfinished drafts
    //  - neither              page reload mid-inspection: restore the current draft
    const params = new URLSearchParams(window.location.search);
    const resumeId = params.get('resume');
    const wantList = params.get('list') === '1';
    if (wantList) localStorage.removeItem('fatt_current_session');
    if (resumeId) localStorage.setItem('fatt_current_session', resumeId);
    let resumed = false;
    if (!wantList) {
      resumed = await this._checkExistingSession();
      if (resumed) this._cleanUrl();
    }
    if (!resumed) await this.showHome();
  },

  // Drop ?list= / ?resume= so a later reload restores the open draft instead
  _cleanUrl() {
    try {
      const u = new URL(window.location.href);
      u.searchParams.delete('list');
      u.searchParams.delete('resume');
      window.history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) { /* file:// or sandboxed: harmless */ }
  },

  // Chrome (steps, session bar, Previous/Next) is hidden while the drafts list shows.
  _setChrome(visible) {
    ['.session-bar', '#stepsNav', '.bottom-nav'].forEach(sel => {
      const el = document.querySelector(sel);
      if (el) el.style.display = visible ? '' : 'none';
    });
  },

  async _loadDrafts() {
    if (typeof StorageAdapter === 'undefined') return [];
    const sessions = (await StorageAdapter.listSessions()) || [];
    return sessions
      .filter(s => s && s.data && s.data.status !== 'submitted' && s.data.status !== 'approved')
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },

  // Get Start home: every unfinished file + "Start New Inspection".
  // With no unfinished files it goes straight to a blank form.
  async showHome() {
    const drafts = await this._loadDrafts();
    if (drafts.length === 0) { await this.startNew(); return; }
    this.listMode = true;
    this.sessionId = null;
    this.sessionData = {};
    localStorage.removeItem('fatt_current_session');
    this._setChrome(false);
    await this._renderHome(drafts);
  },

  async _renderHome(drafts) {
    drafts = drafts || await this._loadDrafts();
    const panel = this._draftsHtml(drafts);
    document.getElementById('stepContent').innerHTML = `
      ${panel}
      <button class="btn btn-primary w-full" style="margin-top:4px;" onclick="BTeam.startNew()" data-i18n="bteam.start_new">开始新检验</button>`;
    if (window.I18n) I18n.apply();
  },

  // Blank form for a brand-new file; the existing drafts are left untouched.
  async startNew() {
    this.listMode = false;
    this.sessionId = null;
    this.sessionData = {};
    this._expandedBoxes = new Set();
    localStorage.removeItem('fatt_current_session');
    this._cleanUrl();
    this._setChrome(true);
    document.getElementById('sessionName').textContent = '--';
    this.currentStep = 0;
    document.querySelectorAll('.step-item').forEach((el, i) => { el.classList.toggle('active', i === 0); el.classList.remove('done'); });
    await this.goToStep(0);
  },

  _formatTimestamp(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  },

  _renderSteps() {
    const nav = document.getElementById('stepsNav');
    nav.innerHTML = STEPS.map((s, i) => `
      <div class="step-item ${i === 0 ? 'active' : ''}" data-step="${i}" onclick="BTeam.goToStep(${i})">
        <span class="step-num">${i + 1}</span>
        <span data-i18n="${s.i18n}">${stepLabel(i)}</span>
      </div>
    `).join('');
  },

  async _checkExistingSession() {
    const sid = localStorage.getItem('fatt_current_session');
    if (!sid) return false;
    if (typeof StorageAdapter === 'undefined') {
      this.sessionId = sid;
      document.getElementById('sessionName').textContent = sid;
      return false;
    }
    const data = await StorageAdapter.loadSession(sid);
    if (!data || data.status === 'submitted') {
      // Finished (or unknown/legacy) session: don't silently resume it as the
      // active one — a new "Start New Inspection" should get a fresh session.
      localStorage.removeItem('fatt_current_session');
      return false;
    }
    // Restore the in-progress session in full (fixes photos/fields appearing to
    // vanish if the page gets reloaded mid-inspection, e.g. by the mobile OS
    // reclaiming the tab while the camera/gallery picker is open).
    this.sessionId = sid;
    this.sessionData = data;
    document.getElementById('sessionName').textContent = data.customer || sid;
    // Jump back to whichever step was open when the user last left (e.g. via
    // the Home button), so resuming from the drafts list or the Customer
    // folder's "Pending" list lands exactly where they left off.
    const resumeStep = (typeof data.lastStep === 'number' && data.lastStep >= 0 && data.lastStep < STEPS.length) ? data.lastStep : 0;
    await this.goToStep(resumeStep);
    return true;
  },

  // Called from the "unfinished drafts" list (step 0) to jump into a draft
  // other than whichever one fatt_current_session already points at — this
  // is what lets more than one unfinished inspection be found again, instead
  // of the single current-session pointer silently overwriting the way to
  // reach an earlier draft.
  async resumeDraft(sessionId) {
    localStorage.setItem('fatt_current_session', sessionId);
    this.listMode = false;
    this._cleanUrl();
    this._setChrome(true);
    const ok = await this._checkExistingSession();
    if (!ok) await this.showHome();
  },

  _esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },

  _saveBasicInfo() {
    const customer = document.getElementById('customerInput').value.trim();
    if (!customer) { alert(window.t ? window.t('form.customer') : 'Please enter customer name'); return false; }
    const now = new Date();
    const existing = this.sessionData || {};
    if (!this.sessionId) this.sessionId = 'session_' + now.getTime();
    this.sessionData = {
      ...existing,
      customer: customer,
      inspectionDate: document.getElementById('inspectionDate').value,
      pi: document.getElementById('piInput').value.trim(),
      batch: document.getElementById('batchInput').value.trim(),
      model: document.getElementById('modelInput').value.trim(),
      version: document.getElementById('versionInput').value.trim(),
      color: document.getElementById('colorInput').value.trim(),
      type: document.getElementById('typeInput').value,
      boxCount: document.getElementById('boxCountInput').value,
      inspectionBy: document.getElementById('inspectionByInput').value.trim(),
      poNo: document.getElementById('poNoInput').value.trim(),
      totalQuantity: document.getElementById('totalQtyInput').value,
      sampleSize: document.getElementById('sampleSizeInput').value,
      supplier: SUPPLIER_NAME,
      timestamp: existing.timestamp || this._formatTimestamp(now),
      status: existing.status || 'in_progress',
      photos: existing.photos || [],
      createdAt: existing.createdAt || now.getTime()
    };
    localStorage.setItem('fatt_current_session', this.sessionId);
    document.getElementById('sessionName').textContent = customer;
    if (typeof StorageAdapter !== 'undefined') {
      StorageAdapter.saveSession(this.sessionId, this.sessionData);
    }
    return true;
  },

  async createSession() {
    if (this._saveBasicInfo()) await this.goToStep(1);
  },

  _updateNavInfo() {
    const el = document.getElementById('navInfo');
    if (!el) return;
    const n = this.currentStep + 1;
    el.textContent = window.t ? window.t('bteam.step_of', { n, total: STEPS.length }) : `Step ${n} of ${STEPS.length}`;
  },

  async goToStep(step) {
    if (step < 0 || step >= STEPS.length) return;
    this.currentStep = step;
    document.querySelectorAll('.step-item').forEach((el, i) => {
      el.classList.toggle('active', i === step);
      if (i < step) el.classList.add('done');
    });
    this._updateNavInfo();
    document.getElementById('prevBtn').style.opacity = step === 0 ? '0.3' : '1';
    await this._renderStepContent(step);
    // Remember progress so leaving via Home and resuming from the drafts
    // list or the Customer folder's "Pending" list jumps straight back here.
    if (this.sessionId && this.sessionData) {
      this.sessionData.lastStep = step;
      if (typeof StorageAdapter !== 'undefined') {
        StorageAdapter.saveSession(this.sessionId, this.sessionData);
      }
    }
  },

  async prevStep() { if (this.currentStep > 0) await this.goToStep(this.currentStep - 1); },
  async nextStep() {
    if (this.currentStep === 0 && !this._saveBasicInfo()) return;
    if (this.currentStep < STEPS.length - 1) await this.goToStep(this.currentStep + 1);
  },

  // Builds the "unfinished drafts" panel markup for step 0: every locally
  // stored session that hasn't been submitted yet (and isn't the one already
  // loaded into this page), so more than one in-progress inspection can be
  // found again, not just whichever one fatt_current_session last pointed at.
  _draftsHtml(drafts) {
    if (!drafts || drafts.length === 0) return '';
    const lang = (window.I18n && I18n.current === 'en') ? 'en' : 'zh';
    const draftsLabel = window.t ? window.t('bteam.unfinished_drafts') : (lang === 'en' ? 'Unfinished Drafts' : '未完成的草稿');
    const untitled = window.t ? window.t('customer.untitled') : '(No customer code)';
    const items = drafts.map(s => {
      const sd = s.data || {};
      const sid = s.key.replace(/^session_/, '');
      const code = (sd.customer || '').trim();
      const name = (code || untitled) + ' - ' + (sd.type === 'sample' ? 'Sample' : 'PSI');
      const stepIdx = (typeof sd.lastStep === 'number' && sd.lastStep >= 0 && sd.lastStep < STEPS.length) ? sd.lastStep : 0;
      const stepSpan = `<span data-i18n="${STEPS[stepIdx].i18n}">${this._esc(stepLabel(stepIdx))}</span>`;
      const metaHtml = [sd.inspectionDate ? this._esc(sd.inspectionDate) : '', stepSpan].filter(Boolean).join(' · ');
      return `
        <div class="draft-item" onclick="BTeam.resumeDraft('${sid}')">
          <div>
            <div class="draft-name">${this._esc(name)}</div>
            <div class="draft-meta">${metaHtml}</div>
          </div>
          <span class="draft-arrow" aria-hidden="true">→</span>
        </div>`;
    }).join('');
    return `<div class="drafts-panel"><div class="drafts-title" data-i18n="bteam.unfinished_drafts">${this._esc(draftsLabel)}</div>${items}</div>`;
  },

  async _renderStepContent(step) {
    const content = document.getElementById('stepContent');
    const stepKey = STEPS[step].key;
    if (stepKey === 'setup') {
      const d = this.sessionData || {};
      const ts = d.timestamp || this._formatTimestamp(new Date());
      const today = new Date().toISOString().split('T')[0];
      content.innerHTML = `
        <div class="step-title" data-i18n="bteam.start_new">开始新检验</div>
        <div class="step-subtitle" data-i18n="role.bteam.desc">现场拍照 · 上传照片 · 记录数据</div>
        <div class="data-form" style="margin-top:16px;">
          <div class="form-group">
            <label class="form-label" data-i18n="form.timestamp">提交时间</label>
            <div class="form-control" id="timestampDisplay" style="display:flex;align-items:center;color:#888;background:rgba(255,255,255,0.03);">${this._esc(ts)}</div>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.customer">客户代码 (Customer Code)</label>
            <input class="form-control" id="customerInput" type="text" data-i18n-placeholder="form.customer.placeholder" placeholder="e.g. NO1" value="${this._esc(d.customer || '')}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.inspection_date">检验日期</label>
            <input class="form-control" id="inspectionDate" type="date" value="${this._esc(d.inspectionDate || today)}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.pi">PI 单号 (Proforma Invoice)</label>
            <input class="form-control" id="piInput" type="text" data-i18n-placeholder="form.pi.placeholder" placeholder="e.g. PI001" value="${this._esc(d.pi || '')}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.batch">批次</label>
            <input class="form-control" id="batchInput" type="text" data-i18n-placeholder="form.batch.placeholder" placeholder="例如：B001" value="${this._esc(d.batch || '')}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.model">型号</label>
            <input class="form-control" id="modelInput" type="text" data-i18n-placeholder="form.model.placeholder" placeholder="例如：EEI-7672" value="${this._esc(d.model || '')}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.version">版本</label>
            <input class="form-control" id="versionInput" type="text" data-i18n-placeholder="form.version.placeholder" placeholder="e.g. 001" value="${this._esc(d.version || '')}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.color">颜色</label>
            <input class="form-control" id="colorInput" type="text" data-i18n-placeholder="form.color.placeholder" placeholder="e.g. White" value="${this._esc(d.color || '')}" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.type">检验类型</label>
            <select class="form-control" id="typeInput">
              <option value="psi" data-i18n="form.type.psi" ${(!d.type || d.type === 'psi') ? 'selected' : ''}>PSI 生产检验</option>
              <option value="sample" data-i18n="form.type.sample" ${d.type === 'sample' ? 'selected' : ''}>Sample 样品检验</option>
            </select>
          </div>
          <div class="form-group">

          <div class="aql-row"><span class="aql-label" data-i18n="form.customer">客户代码</span><span class="aql-value" id="sum-customer">-</span></div>
          <div class="aql-row"><span class="aql-label" data-i18n="form.inspection_date">检验日期</span><span class="aql-value" id="sum-date">-</span></div>

          <div class="aql-row"><span class="aql-label" data-i18n="form.total_qty">总数量</span><span class="aql-value" id="sum-totalqty">-</span></div>
          <div class="aql-row"><span class="aql-label" data-i18n="form.sample_size">抽样数量</span><span class="aql-value" id="sum-samplesize">-</span></div>

        <button class="btn btn-success w-full" style="margin-top:20px;" onclick="BTeam.askSubmit()" data-i18n="common.submit">提交检验</button>
      `;
      if (this.sessionData) {
        document.getElementById('sum-timestamp').textContent = this.sessionData.timestamp || '-';
        document.getElementById('sum-customer').textContent = this.sessionData.customer || '-';
        document.getElementById('sum-date').textContent = this.sessionData.inspectionDate || '-';

        document.getElementById('sum-type').textContent = this.sessionData.type ? (window.t ? window.t('form.type.' + this.sessionData.type) : this.sessionData.type) : '-';

    }
    if (window.I18n) I18n.apply();
  },

  _emptyEntry(withDims) {
    const e = { photoIds: [], detail: '' };
    if (withDims) {
      e.dims = { length: '', height: '', width: '', weight: '' };
      // Each of Length / Height / Width / Weight has its own photo drop zone
      e.dimPhotos = { length: [], height: [], width: [], weight: [] };
    }
    return e;
  },

  _ensureMeasurements() {
    if (!this.sessionData) this.sessionData = {};
    if (!this.sessionData.measurements) this.sessionData.measurements = { boxes: {} };
    const m = this.sessionData.measurements;
    if (!m.boxes) m.boxes = {};
    if (!m.assembly) m.assembly = {};

    GLOBAL_CATEGORIES.forEach(cat => {
      if (!m.assembly[cat.key]) m.assembly[cat.key] = this._emptyEntry(cat.dims);
      if (cat.dims && !m.assembly[cat.key].dims) m.assembly[cat.key].dims = this._emptyEntry(true).dims;
    });

    const boxCount = Math.max(1, parseInt(this.sessionData.boxCount, 10) || 1);
    for (let b = 1; b <= boxCount; b++) {
      if (!m.boxes[b]) m.boxes[b] = {};
      MEASURE_CATEGORIES.forEach(cat => {
        if (!m.boxes[b][cat.key]) m.boxes[b][cat.key] = this._emptyEntry(cat.dims);
        if (cat.dims && !m.boxes[b][cat.key].dims) m.boxes[b][cat.key].dims = this._emptyEntry(true).dims;
      });
    }

    // Drafts saved before Fully/Dimension Assembly became independent sections
    // kept them inside every box: fold those photos/notes into the new
    // sections so nothing disappears.
    Object.keys(m.boxes).forEach(b => {
      GLOBAL_CATEGORIES.forEach(cat => {
        const old = m.boxes[b] && m.boxes[b][cat.key];
        if (!old) return;
        const dest = m.assembly[cat.key];
        (old.photoIds || []).forEach(id => { if (!dest.photoIds.includes(id)) dest.photoIds.push(id); });
        if ((old.detail || '').trim()) dest.detail = (dest.detail ? dest.detail + '\n' : '') + old.detail.trim();
        delete m.boxes[b][cat.key];
      });
    });

    // Dimension sections now keep photos per field (Length / Height / Width /
    // Weight). Photos that older drafts dropped into the single zone are
    // released back to the "Uploaded photos" pool so they can be re-assigned.
    const fixDims = (entry) => {
      if (!entry) return;
      if (!entry.dimPhotos) entry.dimPhotos = { length: [], height: [], width: [], weight: [] };
      DIM_FIELDS.forEach(f => { if (!Array.isArray(entry.dimPhotos[f])) entry.dimPhotos[f] = []; });
      if (entry.photoIds && entry.photoIds.length) entry.photoIds = [];
    };
    Object.keys(m.boxes).forEach(b => MEASURE_CATEGORIES.forEach(cat => { if (cat.dims) fixDims(m.boxes[b][cat.key]); }));
    GLOBAL_CATEGORIES.forEach(cat => { if (cat.dims) fixDims(m.assembly[cat.key]); });
    return boxCount;
  },

  // Entry for a drop zone: a real box number, or the independent "global" sections.
  _getEntry(box, cat) {
    const m = this.sessionData && this.sessionData.measurements;
    if (!m) return null;
    if (String(box) === GLOBAL_BOX) return (m.assembly && m.assembly[cat]) || null;
    return (m.boxes && m.boxes[box] && m.boxes[box][cat]) || null;
  },

  // Photo list a drop zone writes to: the entry's own list, or one dimension field's list.
  _zoneList(entry, field) {
    if (!entry) return null;
    if (field) {
      if (!entry.dimPhotos) entry.dimPhotos = { length: [], height: [], width: [], weight: [] };
      if (!Array.isArray(entry.dimPhotos[field])) entry.dimPhotos[field] = [];
      return entry.dimPhotos[field];
    }
    if (!Array.isArray(entry.photoIds)) entry.photoIds = [];
    return entry.photoIds;
  },

  _entryPhotoIds(entry) {
    const ids = [...((entry && entry.photoIds) || [])];
    if (entry && entry.dimPhotos) Object.keys(entry.dimPhotos).forEach(f => ids.push(...(entry.dimPhotos[f] || [])));
    return ids;
  },

  _getAssignedPhotoIds() {
    const assigned = new Set();
    const m = this.sessionData.measurements || {};
    const boxes = m.boxes || {};
    Object.keys(boxes).forEach(b => {
      Object.keys(boxes[b]).forEach(cat => {
        this._entryPhotoIds(boxes[b][cat]).forEach(id => assigned.add(id));
      });
    });
    Object.keys(m.assembly || {}).forEach(cat => {
      this._entryPhotoIds(m.assembly[cat]).forEach(id => assigned.add(id));
    });
    return assigned;
  },

  _photoThumbHtml(photoId, dataUrl) {
    if (!dataUrl) return '';
    return `<div class="drag-thumb" data-photo-id="${photoId}"><img src="${dataUrl}" alt="photo" draggable="false" /></div>`;
  },

  // Resolves a batch of photoIds to data URLs in parallel via StorageAdapter
  // (IndexedDB-backed, async) so render methods can build their HTML strings
  // synchronously afterward instead of awaiting one image at a time.
  async _loadImageMap(ids) {
    const map = {};
    if (typeof StorageAdapter === 'undefined' || !this.sessionId) return map;
    await Promise.all(ids.map(async (id) => {
      map[id] = await StorageAdapter.loadImage(this.sessionId, id);
    }));
    return map;
  },

  async _renderMeasurements() {
    const boxCount = this._ensureMeasurements();
    const allPhotoIds = this.sessionData.photos || [];
    const assigned = this._getAssignedPhotoIds();
    const poolIds = allPhotoIds.filter(id => !assigned.has(id));
    const lang = (window.I18n && I18n.current === 'en') ? 'en' : 'zh';
    const noPhotosText = window.t ? window.t('photo.no_photos') : (lang === 'en' ? 'No photos yet' : '暂无照片');
    const detailPlaceholder = window.t ? window.t('measure.detail_placeholder') : (lang === 'en' ? 'Add notes...' : '填写备注...');

    const imgMap = await this._loadImageMap(allPhotoIds);

    let html = `
      <div class="step-title" data-i18n="measure.title">尺寸测量</div>
      <div class="step-subtitle" data-i18n="measure.subtitle">将照片拖拽到对应分类</div>
      <div class="photo-pool">
        <div class="pool-title" data-i18n="measure.uploaded_photos">已上传照片</div>
        <div class="pool-grid" id="photoPool" data-role="pool">
    `;
    if (poolIds.length === 0) {
      html += `<div class="pool-empty-hint">${this._esc(noPhotosText)}</div>`;
    } else {
      poolIds.forEach(id => { html += this._photoThumbHtml(id, imgMap[id]); });
    }
    html += `</div></div><div id="boxesContainer">`;

    const block = (box, cat, entry, withNotes) => {
      const label = lang === 'en' ? cat.en : cat.zh;
      let h = `
          <div class="category-block">
            <div class="category-label">${this._esc(label)}</div>`;
      const zoneHtml = (field, list) => {
        let z = `
            <div class="dropzone" data-role="dropzone" data-box="${box}" data-cat="${cat.key}"${field ? ` data-field="${field}"` : ''}>`;
        if (!list || list.length === 0) z += `<div class="dropzone-empty-hint">${this._esc(noPhotosText)}</div>`;
        else list.forEach(id => { z += this._photoThumbHtml(id, imgMap[id]); });
        return z + `</div>`;
      };
      if (cat.dims) {
        // One input + one drop zone for each of Length / Height / Width / Weight
        DIM_FIELDS.forEach(f => {
          const v = (entry.dims && entry.dims[f]) || '';
          h += `
            <div class="dim-block" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
              <label class="dim-field">
                <span class="dim-label" data-i18n="measure.dim.${f}">${f}</span>
                <input class="form-control" type="text" inputmode="decimal" value="${this._esc(v)}" oninput="BTeam.updateMeasureDim('${box}', '${cat.key}', '${f}', this.value)" />
              </label>${zoneHtml(f, entry.dimPhotos && entry.dimPhotos[f])}
            </div>`;
        });
      } else {
        h += zoneHtml('', entry.photoIds);
      }
      if (withNotes) {
        h += `
            <textarea class="form-control category-detail" placeholder="${this._esc(detailPlaceholder)}" oninput="BTeam.updateMeasureDetail('${box}', '${cat.key}', this.value)">${this._esc(entry.detail || '')}</textarea>`;
      }
      return h + `
          </div>`;
    };

    const section = (id, titleHtml, inner) => {
      const isOpen = this._expandedBoxes.has(id);
      return `
        <div class="box-section">
          <div class="box-header" onclick="BTeam.toggleBox('${id}')">
            <span class="box-toggle-icon" id="boxIcon${id}">${isOpen ? '▼' : '▶'}</span>
            ${titleHtml}
          </div>
          <div class="box-body" id="boxBody${id}" style="display:${isOpen ? 'flex' : 'none'};">${inner}</div>
        </div>`;
    };

    for (let b = 1; b <= boxCount; b++) {
      const inner = MEASURE_CATEGORIES.map(cat =>
        block(b, cat, this.sessionData.measurements.boxes[b][cat.key], !cat.dims)
      ).join('');
      html += section(b, `<span data-i18n="measure.box">箱</span> ${b}`, inner);
    }
    // Independent sections, shown once after the boxes
    GLOBAL_CATEGORIES.forEach(cat => {
      const entry = this.sessionData.measurements.assembly[cat.key];
      const title = this._esc(lang === 'en' ? cat.en : cat.zh);
      html += section(cat.key, `<span>${title}</span>`, block(GLOBAL_BOX, { ...cat, zh: '', en: '' }, entry, cat.notes !== false));
    });
    html += `</div>`;
    return html;
  },

  toggleBox(b) {
    // Box numbers arrive as strings from inline handlers; keep them numeric so
    // they match the numbers used when rendering, but leave section ids alone.
    if (typeof b === 'string' && /^\d+$/.test(b)) b = Number(b);
    if (this._expandedBoxes.has(b)) this._expandedBoxes.delete(b); else this._expandedBoxes.add(b);
    const body = document.getElementById('boxBody' + b);
    const icon = document.getElementById('boxIcon' + b);
    const isOpen = this._expandedBoxes.has(b);
    if (body) body.style.display = isOpen ? 'flex' : 'none';
    if (icon) icon.textContent = isOpen ? '▼' : '▶';
  },

  updateMeasureDetail(box, cat, value) {
    const entry = this._getEntry(box, cat);
    if (!entry) return;
    entry.detail = value;
    if (typeof StorageAdapter !== 'undefined' && this.sessionId) {
      StorageAdapter.saveSession(this.sessionId, this.sessionData);
    }
  },

  updateMeasureDim(box, cat, field, value) {
    const entry = this._getEntry(box, cat);
    if (!entry || !DIM_FIELDS.includes(field)) return;
    if (!entry.dims) entry.dims = this._emptyEntry(true).dims;
    entry.dims[field] = value.trim();
    if (typeof StorageAdapter !== 'undefined' && this.sessionId) {
      StorageAdapter.saveSession(this.sessionId, this.sessionData);
    }
  },

  _attachDragHandlers() {
    const thumbs = document.querySelectorAll('#stepContent .drag-thumb');
    thumbs.forEach(el => {
      el.addEventListener('pointerdown', (ev) => this._onThumbPointerDown(ev, el));
    });
  },

  _onThumbPointerDown(e, el) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const photoId = el.dataset.photoId;
    const originZone = el.closest('[data-role]');
    const originBox = originZone ? (originZone.dataset.box || null) : null;
    const originCat = originZone ? (originZone.dataset.cat || null) : null;
    const originField = originZone ? (originZone.dataset.field || '') : '';

    const rect = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.zIndex = '9999';
    ghost.style.pointerEvents = 'none';
    ghost.style.opacity = '0.9';
    ghost.style.transform = 'scale(1.1)';
    ghost.classList.add('drag-ghost');
    document.body.appendChild(ghost);
    el.style.opacity = '0.3';

    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    let lastZone = null;

    // --- Edge auto-scroll -------------------------------------------------
    // While a thumbnail is being dragged the browser's own touch scrolling is
    // off (touch-action:none on .drag-thumb), so the page can't be scrolled by
    // hand. Instead, when the finger gets within EDGE_PX of the top/bottom of
    // the visible area, scroll automatically; the closer to the edge, the
    // faster. The drop target is re-evaluated every frame because content
    // moves under a stationary finger.
    // Which element scrolls depends on the layout: on phones the whole page
    // (window) scrolls, on larger screens #stepContent may be its own scroll
    // container. Pick whichever can actually scroll at the moment.
    const stepContent = document.getElementById('stepContent');
    const EDGE_PX = 70;      // size of the hot zone at each edge
    const MAX_SPEED = 18;    // px per frame at the very edge (~1000px/s)
    let lastX = e.clientX, lastY = e.clientY;
    let scrollRaf = null;

    const innerScrolls = () => !!stepContent && stepContent.scrollHeight > stepContent.clientHeight + 1;

    const updateDropZone = () => {
      ghost.style.display = 'none';
      const under = document.elementFromPoint(lastX, lastY);
      ghost.style.display = '';
      const zone = under ? under.closest('[data-role]') : null;
      if (lastZone && lastZone !== zone) lastZone.classList.remove('drag-over');
      if (zone) zone.classList.add('drag-over');
      lastZone = zone;
    };

    const scrollSpeed = () => {
      let top = 0, bottom = window.innerHeight;
      if (innerScrolls()) {
        const r = stepContent.getBoundingClientRect();
        top = Math.max(r.top, 0);
        bottom = Math.min(r.bottom, window.innerHeight);
      }
      if (lastY < top + EDGE_PX) {
        return -MAX_SPEED * Math.min(1, (top + EDGE_PX - lastY) / EDGE_PX);
      }
      if (lastY > bottom - EDGE_PX) {
        return MAX_SPEED * Math.min(1, (lastY - (bottom - EDGE_PX)) / EDGE_PX);
      }
      return 0;
    };

    // Returns true if the view actually moved.
    const scrollByAmount = (dy) => {
      if (innerScrolls()) {
        const before = stepContent.scrollTop;
        stepContent.scrollTop = before + dy;
        if (stepContent.scrollTop !== before) return true;
      }
      const beforeY = window.scrollY;
      window.scrollBy(0, dy);
      return window.scrollY !== beforeY;
    };

    const autoScrollTick = () => {
      scrollRaf = null;
      const v = scrollSpeed();
      if (v !== 0) {
        if (scrollByAmount(v)) updateDropZone();
        scrollRaf = requestAnimationFrame(autoScrollTick);
      }
    };

    const onMove = (ev) => {
      lastX = ev.clientX;
      lastY = ev.clientY;
      ghost.style.left = (lastX - offsetX) + 'px';
      ghost.style.top = (lastY - offsetY) + 'px';
      updateDropZone();
      if (scrollRaf === null && scrollSpeed() !== 0) {
        scrollRaf = requestAnimationFrame(autoScrollTick);
      }
    };

    const onUp = async (ev) => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (scrollRaf !== null) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
      ghost.remove();
      el.style.opacity = '';
      if (lastZone) lastZone.classList.remove('drag-over');

      const target = lastZone;
      if (target) {
        const toBox = target.dataset.box || null;
        const toCat = target.dataset.cat || null;
        const toField = target.dataset.field || '';
        await this._movePhoto(photoId, originBox, originCat, originField, toBox, toCat, toField);
      }
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  },

  async _movePhoto(photoId, fromBox, fromCat, fromField, toBox, toCat, toField) {
    if (fromBox === toBox && fromCat === toCat && (fromField || '') === (toField || '')) return;
    if (fromBox && fromCat) {
      const src = this._getEntry(fromBox, fromCat);
      const list = this._zoneList(src, fromField);
      if (list) {
        const keep = list.filter(id => id !== photoId);
        list.length = 0; keep.forEach(id => list.push(id));
      }
    }
    if (toBox && toCat) {
      this._ensureMeasurements();
      const dest = this._getEntry(toBox, toCat);
      const list = this._zoneList(dest, toField);
      if (list && !list.includes(photoId)) list.push(photoId);
    }
    if (typeof StorageAdapter !== 'undefined' && this.sessionId) {
      await StorageAdapter.saveSession(this.sessionId, this.sessionData);
    }
    await this._renderStepContent(this.currentStep);
  },

  handlePhotos(input) {
    const files = Array.from(input.files);
    if (!this.sessionData) this.sessionData = {};
    if (!this.sessionData.photos) this.sessionData.photos = [];
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const photoId = 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        this.sessionData.photos.push(photoId);
        if (typeof StorageAdapter !== 'undefined' && this.sessionId) {
          await StorageAdapter.saveImage(this.sessionId, photoId, e.target.result);
          await StorageAdapter.saveSession(this.sessionId, this.sessionData);
        }
        this._addPhotoToGrid(photoId, e.target.result);
      };
      reader.readAsDataURL(file);
    });
    input.value = '';
  },

  _addPhotoToGrid(photoId, dataUrl) {
    const grid = document.getElementById('photoGrid');
    if (!grid) return;
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.dataset.photoId = photoId;
    div.innerHTML = `<img src="${dataUrl}" alt="photo" /><button type="button" class="photo-remove" onclick="event.stopPropagation(); BTeam.removePhoto('${photoId}')" aria-label="Delete">✕</button>`;
    grid.appendChild(div);
  },

  async _renderPhotoGrid() {
    const grid = document.getElementById('photoGrid');
    if (!grid) return;
    grid.innerHTML = '';
    const photos = (this.sessionData && this.sessionData.photos) || [];
    const imgMap = await this._loadImageMap(photos);
    photos.forEach(photoId => {
      const dataUrl = imgMap[photoId];
      if (dataUrl) this._addPhotoToGrid(photoId, dataUrl);
    });
  },

  async removePhoto(photoId) {
    const lang = (window.I18n && I18n.current === 'en') ? 'en' : 'zh';
    const confirmMsg = window.t ? window.t('photo.delete_confirm') : (lang === 'en' ? 'Delete this photo?' : '确定删除这张照片？');
    if (!confirm(confirmMsg)) return;
    if (this.sessionData && this.sessionData.photos) {
      this.sessionData.photos = this.sessionData.photos.filter(id => id !== photoId);
      // Also drop it from any measurement category it was dragged into, so
      // step 3 never keeps a dangling reference to a deleted photo.
      const m = this.sessionData.measurements;
      const boxes = m && m.boxes;
      if (boxes) {
        Object.keys(boxes).forEach(b => {
          Object.keys(boxes[b]).forEach(cat => {
            const entry = boxes[b][cat];
            if (entry && entry.photoIds) entry.photoIds = entry.photoIds.filter(id => id !== photoId);
            if (entry && entry.dimPhotos) Object.keys(entry.dimPhotos).forEach(f => { entry.dimPhotos[f] = (entry.dimPhotos[f] || []).filter(id => id !== photoId); });
          });
        });
      }
      if (m && m.assembly) {
        Object.keys(m.assembly).forEach(cat => {
          const entry = m.assembly[cat];
          if (entry && entry.photoIds) entry.photoIds = entry.photoIds.filter(id => id !== photoId);
          if (entry && entry.dimPhotos) Object.keys(entry.dimPhotos).forEach(f => { entry.dimPhotos[f] = (entry.dimPhotos[f] || []).filter(id => id !== photoId); });
        });
      }
      if (typeof StorageAdapter !== 'undefined' && this.sessionId) {
        await StorageAdapter.saveSession(this.sessionId, this.sessionData);
        await StorageAdapter.removeImage(this.sessionId, photoId);
      }
    }
    const el = document.querySelector(`.photo-item[data-photo-id="${photoId}"]`);
    if (el) el.remove();
  },

  // Submit button -> "Are you sure?" dialog. Nothing is submitted unless Yes is chosen.
  askSubmit() {
    if (this._submitting) return;
    if (!this.sessionId || !this.sessionData) { alert('No session!'); return; }
    if (this.sessionData.status === 'submitted') return;
    this.closeSubmitDialog();
    const d = this.sessionData;
    const T = (k, fb) => (window.t ? window.t(k) : fb);
    const typeText = d.type ? T('form.type.' + d.type, d.type) : '-';
    const rows = [
      [T('form.customer', 'Customer Code'), d.customer || '-'],
      [T('form.type', 'Inspection Type'), typeText],
      [T('form.pi', 'PI'), d.pi || '-'],
      [T('form.inspection_date', 'Date'), d.inspectionDate || '-'],
      [T('form.box_count', 'Box Count'), d.boxCount || '-'],
      [T('submit.photos', 'Photos'), String((d.photos || []).length)]
    ].map(r => `<div class="aql-row"><span class="aql-label">${this._esc(r[0])}</span><span class="aql-value">${this._esc(r[1])}</span></div>`).join('');
    const overlay = document.createElement('div');
    overlay.id = 'submitDialog';
    overlay.className = 'modal-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-title" data-i18n="submit.confirm_title">${this._esc(T('submit.confirm_title', 'Are you sure you want to submit?'))}</div>
        <div class="aql-panel" style="margin-bottom:12px;">${rows}</div>
        <div style="font-size:12px;color:#aaa;" data-i18n="submit.confirm_note">${this._esc(T('submit.confirm_note', 'Once submitted, this file can no longer be edited.'))}</div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="submitNoBtn" data-i18n="submit.no">${this._esc(T('submit.no', 'No, go back'))}</button>
          <button class="btn btn-success" id="submitYesBtn" data-i18n="submit.yes">${this._esc(T('submit.yes', 'Yes, submit'))}</button>
        </div>
      </div>`;
    overlay.addEventListener('click', (ev) => { if (ev.target === overlay && !this._submitting) this.closeSubmitDialog(); });
    document.body.appendChild(overlay);
    document.getElementById('submitNoBtn').onclick = () => this.closeSubmitDialog();
    document.getElementById('submitYesBtn').onclick = () => this.submitInspection();
    this._submitKeyHandler = (ev) => { if (ev.key === 'Escape' && !this._submitting) this.closeSubmitDialog(); };
    document.addEventListener('keydown', this._submitKeyHandler);
    document.getElementById('submitNoBtn').focus();   // default focus is the safe choice
  },

  closeSubmitDialog() {
    const el = document.getElementById('submitDialog');
    if (el) el.remove();
    if (this._submitKeyHandler) { document.removeEventListener('keydown', this._submitKeyHandler); this._submitKeyHandler = null; }
  },

  // Only reached from the "Yes" button. The file counts as submitted only once
  // the saved copy has been read back with status "submitted".
  async submitInspection() {
    if (this._submitting) return;
    if (!this.sessionId || !this.sessionData) { alert('No session!'); return; }
    this._submitting = true;
    const yes = document.getElementById('submitYesBtn'), no = document.getElementById('submitNoBtn');
    if (yes) yes.disabled = true;
    if (no) no.disabled = true;
    const T = (k, fb) => (window.t ? window.t(k) : fb);
    const previous = { status: this.sessionData.status, submittedAt: this.sessionData.submittedAt };
    try {
      this.sessionData.status = 'submitted';
      this.sessionData.submittedAt = Date.now();
      if (typeof StorageAdapter === 'undefined') throw new Error('no storage');
      await StorageAdapter.saveSession(this.sessionId, this.sessionData);
      const saved = await StorageAdapter.loadSession(this.sessionId);
      if (!saved || saved.status !== 'submitted') throw new Error('not saved');
    } catch (err) {
      console.error('[BTeam] submit failed:', err);
      // Put the file back exactly as it was: still an unfinished draft
      this.sessionData.status = previous.status || 'in_progress';
      if (previous.submittedAt) this.sessionData.submittedAt = previous.submittedAt; else delete this.sessionData.submittedAt;
      try { if (typeof StorageAdapter !== 'undefined') await StorageAdapter.saveSession(this.sessionId, this.sessionData); } catch (e) { /* ignore */ }
      this._submitting = false;
      this.closeSubmitDialog();
      alert(T('submit.failed', 'Submit failed. Nothing was submitted - please try again.'));
      return;
    }
    // Release the draft pointer: this file is finished and no longer resumable
    localStorage.removeItem('fatt_current_session');
    this.closeSubmitDialog();
    alert(T('submit.done', 'Submitted successfully.'));
    window.location.href = '../index.html';
  }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => BTeam.init());
} else { BTeam.init(); }
window.BTeam = BTeam;
</script>
</body>
</html>
